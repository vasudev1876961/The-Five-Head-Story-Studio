name: CI Verification

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
  STREAMLIT_SERVER_HEADLESS: "true"
  PYTHONUNBUFFERED: "1"

jobs:
  compatibility-tests:
    name: Compatibility (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify installed CLI entry points (--help)
        run: |
          python -c "import shutil, subprocess; [subprocess.run([shutil.which(c) or c, '--help'], check=True) for c in ('five-head-monte-carlo', 'five-head-scoring', 'five-head-prediction', 'five-head-studio')]"

      - name: Prepare reports directory
        run: python -c "import pathlib; pathlib.Path('reports').mkdir(parents=True, exist_ok=True)"

      - name: Run unit and integration tests (excluding lifecycle harness covered on Python 3.12)
        id: compat_tests
        run: |
          python -m pytest tests --ignore=tests/test_ui/test_studio_lifecycle.py -v -rs --junitxml="reports/junit-compat-${{ matrix.os }}-py${{ matrix.python-version }}.xml"

      - name: Report test summary from JUnit XML
        if: steps.compat_tests.outcome == 'success' || steps.compat_tests.outcome == 'failure'
        shell: bash
        env:
          JUNIT_PATH: reports/junit-compat-${{ matrix.os }}-py${{ matrix.python-version }}.xml
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PY: ${{ matrix.python-version }}
        run: |
          python - <<'EOF'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          junit_path = Path(os.environ["JUNIT_PATH"])
          if not junit_path.is_file():
              print(f"ERROR: Missing JUnit XML report at {junit_path}", file=sys.stderr)
              sys.exit(1)

          tree = ET.parse(junit_path)
          root = tree.getroot()
          suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
          total = sum(int(s.attrib.get("tests", 0)) for s in suites)
          failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
          errors = sum(int(s.attrib.get("errors", 0)) for s in suites)
          skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
          passed = total - failures - errors - skipped

          lines = [
              f"### Compatibility Run ({os.environ['MATRIX_OS']} / Python {os.environ['MATRIX_PY']})",
              f"- Total collected: {total}",
              f"- Passed: {passed} | Failed: {failures} | Errors: {errors} | Skipped: {skipped}",
              "- Scope: Unit & integration suite (lifecycle suite verified across all OSes in Python 3.12 full-suite job).",
          ]
          summary = "\n".join(lines)
          print(summary)
          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "a", encoding="utf-8") as fh:
                  fh.write(summary + "\n\n")
          EOF

      - name: Upload compatibility JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-compat-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/junit-compat-${{ matrix.os }}-py${{ matrix.python-version }}.xml
          retention-days: 14
          if-no-files-found: warn

  full-suite:
    name: Full Suite & Coverage (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify installed CLI entry points (--help)
        run: |
          python -c "import shutil, subprocess; [subprocess.run([shutil.which(c) or c, '--help'], check=True) for c in ('five-head-monte-carlo', 'five-head-scoring', 'five-head-prediction', 'five-head-studio')]"

      - name: Validate Phase 7 Scratch project (read-only)
        run: python phase_7/scratch/validate_sb3.py

      - name: Prepare reports directory
        run: python -c "import pathlib; pathlib.Path('reports').mkdir(parents=True, exist_ok=True)"

      - name: Run full test suite (including lifecycle suite) with branch coverage
        id: full_tests
        run: |
          python -m pytest tests -v -rs --cov=src/five_head_nlp --cov-branch --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-fail-under=70 --junitxml="reports/junit-full-${{ matrix.os }}-py${{ matrix.python-version }}.xml"

      - name: Enforce coverage thresholds from XML and report lifecycle outcomes
        if: steps.full_tests.outcome == 'success' || steps.full_tests.outcome == 'failure'
        shell: bash
        env:
          COVERAGE_XML_PATH: reports/coverage.xml
          JUNIT_PATH: reports/junit-full-${{ matrix.os }}-py${{ matrix.python-version }}.xml
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PY: ${{ matrix.python-version }}
          MIN_COMBINED_PCT: "70.0"
          MIN_STATEMENT_PCT: "72.0"
          MIN_BRANCH_PCT: "63.0"
        run: |
          python - <<'EOF'
          import os
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          cov_path = Path(os.environ["COVERAGE_XML_PATH"])
          junit_path = Path(os.environ["JUNIT_PATH"])
          min_combined = float(os.environ["MIN_COMBINED_PCT"])
          min_stmt = float(os.environ["MIN_STATEMENT_PCT"])
          min_branch = float(os.environ["MIN_BRANCH_PCT"])

          errors = []
          summary_lines = [
              f"### Full Suite & Coverage ({os.environ['MATRIX_OS']} / Python {os.environ['MATRIX_PY']})"
          ]

          if junit_path.is_file():
              jtree = ET.parse(junit_path)
              jroot = jtree.getroot()
              suites = jroot.findall("testsuite") if jroot.tag == "testsuites" else [jroot]
              total = sum(int(s.attrib.get("tests", 0)) for s in suites)
              failures = sum(int(s.attrib.get("failures", 0)) for s in suites)
              errors_cnt = sum(int(s.attrib.get("errors", 0)) for s in suites)
              skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites)
              passed = total - failures - errors_cnt - skipped

              lifecycle_cases = [
                  tc for tc in jroot.iter("testcase")
                  if "test_studio_lifecycle" in tc.attrib.get("classname", "")
              ]
              lc_total = len(lifecycle_cases)
              lc_fail = sum(1 for tc in lifecycle_cases if tc.find("failure") is not None)
              lc_err = sum(1 for tc in lifecycle_cases if tc.find("error") is not None)
              lc_skip = sum(1 for tc in lifecycle_cases if tc.find("skipped") is not None)
              lc_pass = lc_total - lc_fail - lc_err - lc_skip

              summary_lines.extend([
                  f"- **Full Suite:** {passed}/{total} passed (failed={failures}, errors={errors_cnt}, skipped={skipped})",
                  f"- **Lifecycle Tests (`test_studio_lifecycle.py`):** {lc_pass}/{lc_total} passed (failed={lc_fail}, errors={lc_err}, skipped={lc_skip})",
              ])

              for tc in lifecycle_cases:
                  skip_el = tc.find("skipped")
                  if skip_el is not None:
                      summary_lines.append(
                          f"  - Skipped lifecycle test `{tc.attrib.get('name')}`: {skip_el.attrib.get('message', '')}"
                      )
          else:
              errors.append(f"Missing JUnit XML report at {junit_path}")

          if cov_path.is_file():
              ctree = ET.parse(cov_path)
              croot = ctree.getroot()
              lv = int(croot.attrib["lines-valid"])
              lc = int(croot.attrib["lines-covered"])
              bv = int(croot.attrib["branches-valid"])
              bc = int(croot.attrib["branches-covered"])

              stmt_pct = (lc / lv * 100.0) if lv > 0 else 0.0
              branch_pct = (bc / bv * 100.0) if bv > 0 else 0.0
              combined_pct = ((lc + bc) / (lv + bv) * 100.0) if (lv + bv) > 0 else 0.0

              summary_lines.extend([
                  f"- **Combined Coverage:** {combined_pct:.2f}% ({lc + bc}/{lv + bv}) [gate >= {min_combined:.1f}%]",
                  f"- **Statement Coverage:** {stmt_pct:.2f}% ({lc}/{lv}) [gate >= {min_stmt:.1f}%]",
                  f"- **Branch Coverage:** {branch_pct:.2f}% ({bc}/{bv}) [gate >= {min_branch:.1f}%]",
              ])

              if combined_pct < min_combined:
                  errors.append(f"Combined coverage {combined_pct:.2f}% is below gate {min_combined:.1f}%")
              if stmt_pct < min_stmt:
                  errors.append(f"Statement coverage {stmt_pct:.2f}% is below gate {min_stmt:.1f}%")
              if branch_pct < min_branch:
                  errors.append(f"Branch coverage {branch_pct:.2f}% is below gate {min_branch:.1f}%")
          else:
              errors.append(f"Missing coverage XML report at {cov_path}")

          report = "\n".join(summary_lines)
          print(report)
          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "a", encoding="utf-8") as fh:
                  fh.write(report + "\n\n")

          if errors:
              for err in errors:
                  print(f"GATE FAILURE: {err}", file=sys.stderr)
              sys.exit(1)
          EOF

      - name: Upload coverage and full-suite test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-reports-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            reports/coverage.xml
            reports/junit-full-${{ matrix.os }}-py${{ matrix.python-version }}.xml
          retention-days: 14
          if-no-files-found: warn
