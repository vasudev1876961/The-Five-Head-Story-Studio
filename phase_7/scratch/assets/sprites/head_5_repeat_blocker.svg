<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Repeat Blocker Shield -->
  <circle cx="40" cy="40" r="36" fill="#1f2937" stroke="#d29922" stroke-width="3"/>
